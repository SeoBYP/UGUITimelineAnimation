<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGUI 애니메이션 시스템 구조 (커스텀)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf8;
      --color-ink:     #121417;
      --color-muted:   #2f3640;
      --color-accent:  #0956c0;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · UIAnimation v2</p>
    <h1>UGUI 애니메이션 시스템 구조 (커스텀)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uianim-architecture-title uianim-architecture-desc">
        <title id="uianim-architecture-title">UGUI 애니메이션 시스템 구조 (커스텀)</title>
        <desc id="uianim-architecture-desc">Client code, UIAnimTrigger and UIAnimScroll drive the UIAnimation component, which compiles overrides into CompiledState and registers with UIAnimRunner; the runner evaluates CompiledState, which writes through PropertyWriter, while the UI Animation Editor edits serialized data and Live Preview reuses the same evaluator.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f3640"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0956c0"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a14f00"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafaf8"/>

        <!-- ============ ZONES ============ -->
        <rect x="40" y="152" width="1200" height="280" rx="8" fill="rgba(18,20,23,0.02)" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="52" y="158" width="64" height="14" rx="2" fill="#fafaf8"/>
        <text x="56" y="168" fill="#4a525e" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">RUNTIME</text>

        <rect x="368" y="488" width="552" height="128" rx="8" fill="rgba(18,20,23,0.02)" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="6,4"/>
        <rect x="380" y="494" width="60" height="14" rx="2" fill="#fafaf8"/>
        <text x="384" y="504" fill="#4a525e" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">EDITOR</text>

        <!-- ============ ARROWS (before nodes) ============ -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.06em" text-anchor="middle">
          <!-- PLAY: Client -> UIAnimation (link) -->
          <line x1="468" y1="104" x2="468" y2="198" stroke="#a14f00" stroke-width="1.4" marker-end="url(#arrow-link)"/>
          <rect x="428" y="164" width="32" height="12" rx="2" fill="#fafaf8"/>
          <text x="444" y="173" fill="#a14f00">PLAY</text>

          <!-- SIGNAL: UIAnimation -> Client (link, dashed) -->
          <line x1="532" y1="200" x2="532" y2="106" stroke="#a14f00" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
          <rect x="540" y="164" width="44" height="12" rx="2" fill="#fafaf8"/>
          <text x="562" y="173" fill="#a14f00">SIGNAL</text>

          <!-- EVENT: Trigger -> UIAnimation -->
          <line x1="312" y1="232" x2="398" y2="232" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="338" y="212" width="36" height="12" rx="2" fill="#fafaf8"/>
          <text x="356" y="221" fill="#2f3640">EVENT</text>

          <!-- SCRUB: Scroll -> UIAnimation -->
          <line x1="312" y1="360" x2="398" y2="360" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="338" y="340" width="36" height="12" rx="2" fill="#fafaf8"/>
          <text x="356" y="349" fill="#2f3640">SCRUB</text>

          <!-- REGISTER: UIAnimation -> Runner -->
          <line x1="600" y1="232" x2="686" y2="232" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="618" y="212" width="52" height="12" rx="2" fill="#fafaf8"/>
          <text x="644" y="221" fill="#2f3640">REGISTER</text>

          <!-- COMPILE: UIAnimation -> CompiledState -->
          <line x1="600" y1="360" x2="686" y2="360" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="620" y="340" width="48" height="12" rx="2" fill="#fafaf8"/>
          <text x="644" y="349" fill="#2f3640">COMPILE</text>

          <!-- EVALUATE: Runner -> CompiledState (accent headline) -->
          <line x1="788" y1="264" x2="788" y2="326" stroke="#0956c0" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
          <rect x="796" y="290" width="52" height="12" rx="2" fill="#fafaf8"/>
          <text x="822" y="299" fill="#0956c0" font-weight="600">EVALUATE</text>

          <!-- WRITE: CompiledState -> PropertyWriter -->
          <line x1="888" y1="360" x2="946" y2="360" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="900" y="340" width="36" height="12" rx="2" fill="#fafaf8"/>
          <text x="918" y="349" fill="#2f3640">WRITE</text>

          <!-- EDIT DATA: Editor -> UIAnimation -->
          <line x1="500" y1="520" x2="500" y2="394" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
          <rect x="508" y="454" width="60" height="12" rx="2" fill="#fafaf8"/>
          <text x="538" y="463" fill="#2f3640">EDIT DATA</text>

          <!-- SAME EVALUATOR: Live Preview -> CompiledState (dashed) -->
          <line x1="788" y1="520" x2="788" y2="394" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect x="796" y="454" width="84" height="12" rx="2" fill="#fafaf8"/>
          <text x="838" y="463" fill="#2f3640">SAME EVALUATOR</text>
        </g>

        <!-- ============ NODES ============ -->
        <g font-family="'Geist', system-ui, sans-serif">
          <!-- Client code (input) -->
          <rect x="400" y="40" width="200" height="64" rx="6" fill="#fafaf8"/>
          <rect x="400" y="40" width="200" height="64" rx="6" fill="rgba(47,54,64,0.10)" stroke="#4a525e" stroke-width="1.2"/>
          <rect x="408" y="48" width="44" height="12" rx="2" fill="none" stroke="#4a525e" stroke-width="0.8"/>
          <text x="430" y="57" fill="#4a525e" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CALLER</text>
          <text x="500" y="78" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">Client code</text>
          <text x="500" y="94" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PlayAsync · Signal</text>

          <!-- UIAnimTrigger -->
          <rect x="72" y="200" width="240" height="64" rx="6" fill="#fafaf8"/>
          <rect x="72" y="200" width="240" height="64" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <rect x="80" y="208" width="32" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="96" y="217" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MONO</text>
          <text x="192" y="238" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">UIAnimTrigger</text>
          <text x="192" y="254" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Select · Pointer · Toggle · OnEnable</text>

          <!-- UIAnimScroll -->
          <rect x="72" y="328" width="240" height="64" rx="6" fill="#fafaf8"/>
          <rect x="72" y="328" width="240" height="64" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <rect x="80" y="336" width="32" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="96" y="345" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MONO</text>
          <text x="192" y="366" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">UIAnimScroll</text>
          <text x="192" y="382" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Viewport · Scrub</text>

          <!-- UIAnimation (FOCAL) -->
          <rect x="400" y="200" width="200" height="192" rx="6" fill="#fafaf8"/>
          <rect x="400" y="200" width="200" height="192" rx="6" fill="rgba(9,86,192,0.10)" stroke="#0956c0" stroke-width="1.8"/>
          <rect x="408" y="208" width="32" height="12" rx="2" fill="none" stroke="#0956c0" stroke-width="0.8"/>
          <text x="424" y="217" fill="#0956c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MONO</text>
          <text x="500" y="294" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">UIAnimation</text>
          <text x="500" y="310" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">states · overrides</text>

          <!-- UIAnimRunner -->
          <rect x="688" y="200" width="200" height="64" rx="6" fill="#fafaf8"/>
          <rect x="688" y="200" width="200" height="64" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <rect x="696" y="208" width="44" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="718" y="217" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GLOBAL</text>
          <text x="788" y="238" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">UIAnimRunner</text>
          <text x="788" y="254" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LitMotion · unscaled</text>

          <!-- CompiledState (store) -->
          <rect x="688" y="328" width="200" height="64" rx="6" fill="#fafaf8"/>
          <rect x="688" y="328" width="200" height="64" rx="6" fill="rgba(18,20,23,0.05)" stroke="#2f3640" stroke-width="1.2"/>
          <rect x="696" y="336" width="44" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="718" y="345" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STRUCT</text>
          <text x="788" y="366" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">CompiledState</text>
          <text x="788" y="382" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">flat struct arrays · Awake</text>

          <!-- PropertyWriter -->
          <rect x="948" y="328" width="264" height="64" rx="6" fill="#fafaf8"/>
          <rect x="948" y="328" width="264" height="64" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <rect x="956" y="336" width="32" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="972" y="345" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SINK</text>
          <text x="1080" y="366" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">PropertyWriter</text>
          <text x="1080" y="382" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RectTransform · CanvasGroup · Graphic · TMP</text>

          <!-- UI Animation Editor -->
          <rect x="400" y="520" width="200" height="64" rx="6" fill="#fafaf8"/>
          <rect x="400" y="520" width="200" height="64" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <rect x="408" y="528" width="44" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="430" y="537" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WINDOW</text>
          <text x="500" y="558" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">UI Animation Editor</text>
          <text x="500" y="574" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">UI Toolkit window</text>

          <!-- Live Preview (optional) -->
          <rect x="688" y="520" width="200" height="64" rx="6" fill="#fafaf8"/>
          <rect x="688" y="520" width="200" height="64" rx="6" fill="rgba(18,20,23,0.02)" stroke="#2f3640" stroke-width="1.2" stroke-dasharray="4,3"/>
          <rect x="696" y="528" width="56" height="12" rx="2" fill="none" stroke="#2f3640" stroke-width="0.8"/>
          <text x="724" y="537" fill="#2f3640" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
          <text x="788" y="558" fill="#121417" font-size="12" font-weight="600" text-anchor="middle">Live Preview</text>
          <text x="788" y="574" fill="#2f3640" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">AnimationMode · restore</text>
        </g>

        <!-- ============ LEGEND ============ -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#9aa0a8" stroke-width="0.8"/>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#2f3640">
          <text x="40" y="684" font-size="8" font-weight="600" letter-spacing="0.14em" fill="#4a525e">LEGEND</text>

          <rect x="120" y="674" width="16" height="12" rx="2" fill="rgba(9,86,192,0.10)" stroke="#0956c0" stroke-width="1.2"/>
          <text x="142" y="684">Focal component</text>

          <rect x="264" y="674" width="16" height="12" rx="2" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
          <text x="286" y="684">Component</text>

          <rect x="372" y="674" width="16" height="12" rx="2" fill="rgba(18,20,23,0.05)" stroke="#2f3640" stroke-width="1.2"/>
          <text x="394" y="684">Compiled data</text>

          <rect x="500" y="674" width="16" height="12" rx="2" fill="rgba(47,54,64,0.10)" stroke="#4a525e" stroke-width="1.2"/>
          <text x="522" y="684">Caller</text>

          <line x1="588" y1="680" x2="616" y2="680" stroke="#2f3640" stroke-width="1.4"/>
          <text x="624" y="684">Internal call</text>

          <line x1="732" y1="680" x2="760" y2="680" stroke="#0956c0" stroke-width="1.8"/>
          <text x="768" y="684">Per-frame path</text>

          <line x1="876" y1="680" x2="904" y2="680" stroke="#a14f00" stroke-width="1.4"/>
          <text x="912" y="684">Client API / signal</text>

          <line x1="1040" y1="680" x2="1068" y2="680" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4"/>
          <text x="1076" y="684">Async / optional</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
