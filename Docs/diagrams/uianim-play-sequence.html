<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayAsync 재생 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf8;
      --color-ink:     #121417;
      --color-muted:   #2f3640;
      --color-accent:  #0956c0;
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · UIAnimation v2</p>
    <h1>PlayAsync 재생 흐름</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uianim-play-sequence-title uianim-play-sequence-desc">
        <title id="uianim-play-sequence-title">PlayAsync 재생 흐름</title>
        <desc id="uianim-play-sequence-desc">UIAnimation이 Awake에서 상태를 컴파일한 뒤, PlayAsync 호출 시 LitMotion 러너가 매 프레임 CompiledState.Evaluate를 호출해 자식 상태를 먼저 평가하고 바뀐 속성만 쓰며, Signal과 Completed 또는 Interrupted 결과를 클라이언트에 돌려주는 순서.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f3640"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0956c0"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a14f00"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#2f3640" stroke-width="1.2"/></marker>
          <marker id="arrow-open-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#a14f00" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#fafaf8"/>

        <!-- ALT FRAME (zone, painted first) — Client 136 · UIAnimation 400 -->
        <rect x="96" y="504" width="344" height="140" rx="4" fill="rgba(18,20,23,0.03)" stroke="#4a525e" stroke-width="1"/>
        <rect x="96" y="504" width="40" height="16" rx="2" fill="#fafaf8" stroke="#4a525e" stroke-width="1"/>
        <text x="116" y="516" fill="#2f3640" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="148" y="538" fill="#2f3640" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif">[새 Play 호출]</text>
        <line x1="104" y1="588" x2="432" y2="588" stroke="#4a525e" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="148" y="606" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else]</text>

        <!-- LIFELINES — Client 136 · UIAnimation 400 · Runner 656 · CompiledState 896 · Child 1144 -->
        <line x1="136" y1="84" x2="136" y2="656" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="400" y1="84" x2="400" y2="656" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="656" y1="84" x2="656" y2="656" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="896" y1="84" x2="896" y2="656" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1144" y1="84" x2="1144" y2="656" stroke="#9aa0a8" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ACTIVATION BARS -->
        <rect x="396" y="168" width="8" height="464" fill="rgba(18,20,23,0.08)" stroke="#2f3640" stroke-width="1"/>
        <rect x="652" y="256" width="8" height="176" fill="rgba(18,20,23,0.08)" stroke="#2f3640" stroke-width="1"/>
        <rect x="892" y="296" width="8" height="160" fill="rgba(9,86,192,0.10)" stroke="#0956c0" stroke-width="1"/>
        <rect x="1140" y="336" width="8" height="24" fill="rgba(18,20,23,0.08)" stroke="#2f3640" stroke-width="1"/>

        <!-- MESSAGES (arrows before labels and actor boxes) -->
        <!-- M1: Awake self — compile + resolve overrides -->
        <path d="M 400 108 L 436 108 L 436 132 L 404 132" fill="none" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
        <!-- M2: Client → UIAnimation  PlayAsync("Open") (link) -->
        <line x1="136" y1="176" x2="396" y2="176" stroke="#a14f00" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <!-- M3: capture FromCurrent (self) -->
        <path d="M 404 204 L 440 204 L 440 228 L 406 228" fill="none" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
        <!-- M4: UIAnimation → Runner  motion 0→duration -->
        <line x1="404" y1="264" x2="652" y2="264" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
        <!-- M5: Runner → CompiledState  Evaluate(t) per frame (FOCAL) -->
        <line x1="660" y1="304" x2="892" y2="304" stroke="#0956c0" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
        <!-- M6: CompiledState → Child  Evaluate(t') first -->
        <line x1="900" y1="344" x2="1140" y2="344" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
        <!-- M7: write changed properties (self) -->
        <path d="M 900 384 L 936 384 L 936 408 L 902 408" fill="none" stroke="#2f3640" stroke-width="1.4" marker-end="url(#arrow)"/>
        <!-- M8: CompiledState → UIAnimation  signal crossed (async) -->
        <line x1="892" y1="448" x2="406" y2="448" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <!-- M9: UIAnimation → Client  Signal event (link, async) -->
        <line x1="396" y1="480" x2="138" y2="480" stroke="#a14f00" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-open-link)"/>
        <!-- M10a: Interrupted (return) -->
        <line x1="396" y1="572" x2="138" y2="572" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M10b: Completed (return) -->
        <line x1="396" y1="628" x2="138" y2="628" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- LABELS (opaque paper masks, 8px gap from stroke) -->
        <rect x="444" y="114" width="84" height="12" rx="2" fill="#fafaf8"/>
        <text x="486" y="123" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AWAKE COMPILE</text>

        <rect x="220" y="156" width="92" height="12" rx="2" fill="#fafaf8"/>
        <text x="266" y="165" fill="#a14f00" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAYASYNC OPEN</text>

        <rect x="448" y="210" width="80" height="12" rx="2" fill="#fafaf8"/>
        <text x="488" y="219" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAPTURE FROM</text>

        <rect x="488" y="244" width="80" height="12" rx="2" fill="#fafaf8"/>
        <text x="528" y="253" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOTION 0→DUR</text>

        <rect x="728" y="284" width="96" height="12" rx="2" fill="#fafaf8"/>
        <text x="776" y="293" fill="#0956c0" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL(T) /FRAME</text>

        <rect x="972" y="324" width="96" height="12" rx="2" fill="#fafaf8"/>
        <text x="1020" y="333" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHILD EVAL(T')</text>

        <rect x="944" y="390" width="84" height="12" rx="2" fill="#fafaf8"/>
        <text x="986" y="399" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE CHANGED</text>

        <rect x="484" y="428" width="88" height="12" rx="2" fill="#fafaf8"/>
        <text x="528" y="437" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGNAL IMPACT</text>

        <rect x="224" y="460" width="84" height="12" rx="2" fill="#fafaf8"/>
        <text x="266" y="469" fill="#a14f00" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGNAL EVENT</text>

        <rect x="184" y="548" width="164" height="16" rx="2" fill="#fafaf8"/>
        <text x="266" y="560" fill="#2f3640" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Malgun Gothic', sans-serif" text-anchor="middle">Interrupted · 예외 없음</text>

        <rect x="232" y="608" width="68" height="12" rx="2" fill="#fafaf8"/>
        <text x="266" y="617" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPLETED</text>

        <!-- CALLOUTS (italic serif, max 2) -->
        <text x="384" y="114" fill="#121417" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif" text-anchor="end">Awake 1회 · 오버라이드 해석</text>
        <text x="384" y="132" fill="#121417" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif" text-anchor="end">가장 바깥 프리팹이 이김</text>

        <text x="876" y="388" fill="#121417" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif" text-anchor="end">자식 먼저 평가 → 부모 트랙 기록</text>
        <text x="876" y="406" fill="#121417" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif KR', serif" text-anchor="end">겹치면 부모가 이김</text>

        <!-- ACTOR BOXES (drawn last) -->
        <!-- Client (input) -->
        <rect x="48" y="24" width="176" height="60" rx="6" fill="#fafaf8"/>
        <rect x="48" y="24" width="176" height="60" rx="6" fill="rgba(47,54,64,0.10)" stroke="#4a525e" stroke-width="1.2"/>
        <rect x="56" y="32" width="48" height="12" rx="2" fill="none" stroke="#4a525e" stroke-width="0.8"/>
        <text x="80" y="41" fill="#4a525e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="136" y="62" fill="#121417" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
        <text x="136" y="76" fill="#4a525e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UI screen code</text>

        <!-- UIAnimation (backend) -->
        <rect x="312" y="24" width="176" height="60" rx="6" fill="#ffffff" stroke="#121417" stroke-width="1.2"/>
        <rect x="320" y="32" width="72" height="12" rx="2" fill="none" stroke="#4a525e" stroke-width="0.8"/>
        <text x="356" y="41" fill="#4a525e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPONENT</text>
        <text x="400" y="62" fill="#121417" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UIAnimation</text>
        <text x="400" y="76" fill="#4a525e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MonoBehaviour</text>

        <!-- UIAnimRunner (store-ish runner) -->
        <rect x="568" y="24" width="176" height="60" rx="6" fill="#fafaf8"/>
        <rect x="568" y="24" width="176" height="60" rx="6" fill="rgba(18,20,23,0.05)" stroke="#2f3640" stroke-width="1.2"/>
        <rect x="576" y="32" width="52" height="12" rx="2" fill="none" stroke="#4a525e" stroke-width="0.8"/>
        <text x="602" y="41" fill="#4a525e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER</text>
        <text x="656" y="62" fill="#121417" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UIAnimRunner</text>
        <text x="656" y="76" fill="#4a525e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LitMotion · unscaled</text>

        <!-- CompiledState (focal) -->
        <rect x="808" y="24" width="176" height="60" rx="6" fill="#fafaf8"/>
        <rect x="808" y="24" width="176" height="60" rx="6" fill="rgba(9,86,192,0.10)" stroke="#0956c0" stroke-width="1.6"/>
        <rect x="816" y="32" width="72" height="12" rx="2" fill="none" stroke="#0956c0" stroke-width="0.8"/>
        <text x="852" y="41" fill="#0956c0" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVALUATOR</text>
        <text x="896" y="62" fill="#121417" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CompiledState</text>
        <text x="896" y="76" fill="#4a525e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ClipRuntime[] · sorted</text>

        <!-- Child UIAnimation (nested, dashed) -->
        <rect x="1056" y="24" width="176" height="60" rx="6" fill="#fafaf8"/>
        <rect x="1056" y="24" width="176" height="60" rx="6" fill="rgba(18,20,23,0.02)" stroke="#4a525e" stroke-width="1.2" stroke-dasharray="4,3"/>
        <rect x="1064" y="32" width="44" height="12" rx="2" fill="none" stroke="#4a525e" stroke-width="0.8"/>
        <text x="1086" y="41" fill="#4a525e" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHILD</text>
        <text x="1144" y="62" fill="#121417" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Child UIAnimation</text>
        <text x="1144" y="76" fill="#4a525e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ChildCall[] · t'</text>

        <!-- LEGEND (bottom strip) -->
        <line x1="40" y1="672" x2="1240" y2="672" stroke="#9aa0a8" stroke-width="0.8"/>
        <text x="40" y="696" fill="#2f3640" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="120" y1="693" x2="152" y2="693" stroke="#2f3640" stroke-width="1.4"/>
        <polygon points="152 690, 160 693, 152 696" fill="#2f3640"/>
        <text x="168" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL</text>

        <line x1="232" y1="693" x2="264" y2="693" stroke="#a14f00" stroke-width="1.4"/>
        <polygon points="264 690, 272 693, 264 696" fill="#a14f00"/>
        <text x="280" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CLIENT CALL · SIGNAL</text>

        <line x1="420" y1="693" x2="452" y2="693" stroke="#0956c0" stroke-width="1.8"/>
        <polygon points="452 690, 460 693, 452 696" fill="#0956c0"/>
        <text x="468" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PER-FRAME HOT PATH</text>

        <line x1="608" y1="693" x2="640" y2="693" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4"/>
        <polygon points="640 690, 648 693, 640 696" fill="#2f3640"/>
        <text x="656" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

        <line x1="736" y1="693" x2="768" y2="693" stroke="#2f3640" stroke-width="1.4" stroke-dasharray="5,4"/>
        <polyline points="768 690, 776 693, 768 696" fill="none" stroke="#2f3640" stroke-width="1.2"/>
        <text x="784" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASYNC NOTIFY</text>

        <rect x="900" y="686" width="8" height="14" fill="rgba(18,20,23,0.08)" stroke="#2f3640" stroke-width="1"/>
        <text x="916" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTIVE</text>

        <text x="1240" y="696" fill="#2f3640" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="end">TIME FLOWS DOWN</text>
      </svg>
    </div>
  </div>
</body>
</html>
