# Runs the Unity EditMode tests with the Unity CLI (batch mode) on a self-hosted Linux runner.
# Unity Personal can only be activated by signing in to Unity Hub, so CI runs on a machine where that is done
# once by hand. Setup: Docs/CI-SelfHostedRunner.md
#
# Branch protection on main requires the "Unity EditMode Tests" check, so a PR can only merge when it passes.
name: Unity Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One Unity at a time on the runner; a newer run of the same ref replaces an older one.
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    name: Unity EditMode Tests
    # Public repo + self-hosted runner: never run code from forks on the machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, unity]
    timeout-minutes: 60
    steps:
      # clean: false keeps the ignored Library/ folder (Unity's import cache) between runs;
      # tracked and untracked source files are still reset below.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset working tree (keep Library cache)
        run: |
          git reset --hard HEAD
          git clean -ffd

      - name: Find Unity editor
        id: unity
        run: |
          version=$(grep -m1 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          editor="${UNITY_EDITOR_ROOT:-$HOME/Unity/Hub/Editor}/$version/Editor/Unity"
          if [ ! -x "$editor" ]; then
            echo "::error::Unity $version 에디터가 없습니다: $editor (Unity Hub로 설치하거나 UNITY_EDITOR_ROOT를 지정하세요)"
            exit 1
          fi
          echo "Unity $version → $editor"
          echo "path=$editor" >> "$GITHUB_OUTPUT"

      - name: Run EditMode tests (Unity CLI, batch mode)
        run: |
          set +e
          "${{ steps.unity.outputs.path }}" -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform EditMode \
            -testResults "$RUNNER_TEMP/editmode-results.xml" \
            -logFile "$RUNNER_TEMP/unity-editor.log"
          code=$?
          echo "Unity exit code: $code (0 = 통과, 2 = 실패한 테스트 있음, 그 외 = 실행 오류)"
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then
            echo "::error::Unity가 테스트를 실행하지 못했습니다 (exit $code). 아래 로그 마지막 부분을 확인하세요."
            tail -n 60 "$RUNNER_TEMP/unity-editor.log" || true
          fi
          exit $code

      - name: Summarize results
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/editmode-results.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not os.path.exists(path):
              out.write("### EditMode 테스트\n결과 파일이 없습니다 (Unity가 테스트를 실행하지 못함).\n")
              sys.exit(0)
          run = ET.parse(path).getroot()
          total, passed, failed, skipped = (run.get(k, "0") for k in ("total", "passed", "failed", "skipped"))
          out.write(f"### EditMode 테스트\n| 전체 | 통과 | 실패 | 건너뜀 |\n|---|---|---|---|\n| {total} | {passed} | {failed} | {skipped} |\n")
          for case in run.iter("test-case"):
              if case.get("result") == "Failed":
                  msg = (case.findtext("failure/message") or "").strip().splitlines()
                  out.write(f"- ❌ `{case.get('fullname')}`: {msg[0] if msg else ''}\n")
                  print(f"::error::{case.get('fullname')}: {msg[0] if msg else 'failed'}")
          if total == "0":
              print("::warning::실행된 테스트가 0개입니다.")
          PY

      - name: Upload test results and editor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: |
            ${{ runner.temp }}/editmode-results.xml
            ${{ runner.temp }}/unity-editor.log
          if-no-files-found: ignore
